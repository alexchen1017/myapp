name: ci
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 與容器（Debian bookworm）相同
      - run: pip install -r requirements.txt
      - name: Python 測試與風格檢查
        run: |
          pytest -q --ignore=tests/test_pages.py || [ $? -eq 5 ]   # 5 = 沒有測試，不算失敗
          ruff check .
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # 下載預先編譯的 R 套件，較快
      - name: R 測試
        run: |
          Rscript -e 'install.packages(c("testthat","readxl","openxlsx","officer"))'
          Rscript -e 'f <- list.files("tests/testthat", pattern = "^test.*\\.R$"); if (length(f)) testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
